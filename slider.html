<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <title>Amazing Slider</title>
    
    <!-- Insert to your webpage before the </head> -->
    <script src="sliderengine/jquery.js"></script>
    <script src="sliderengine/amazingslider.js"></script>
    <link rel="stylesheet" type="text/css" href="sliderengine/amazingslider-1.css">
    <script src="sliderengine/initslider-1.js"></script>
    <!-- End of head section HTML codes -->
    
</head>
<body>
    
    <!-- Insert to your webpage where you want to display the slider -->
    <div class="amazingslider-wrapper" id="amazingslider-wrapper-1" style="display:block;position:relative;max-width:400px;margin:0px auto 108px;">
        <div class="amazingslider" id="amazingslider-1" style="display:block;position:relative;margin:0 auto;">
            <ul class="amazingslider-slides" style="display:none;">
                <li><img src="images/1%20kg%20kisan%20ghee.jpeg" alt="1 kg kisan ghee"  title="1 kg kisan ghee" />
                </li>
                <li><img src="images/DANEDAR%201%20KG.jpeg" alt="DANEDAR 1 KG"  title="DANEDAR 1 KG" />
                </li>
                <li><img src="images/danedar.jpeg" alt="danedar"  title="danedar" />
                </li>
                <li><img src="images/FAMILY%20MISTURE.jpeg" alt="FAMILY MISTURE"  title="FAMILY MISTURE" />
                </li>
                <li><img src="images/KANOLA%20OIL.jpg" alt="KANOLA OIL"  title="KANOLA OIL" />
                </li>
                <li><img src="images/sugar.jpeg" alt="sugar"  title="sugar" />
                </li>
            </ul>
            <ul class="amazingslider-thumbnails" style="display:none;">
                <li><img src="images/1%20kg%20kisan%20ghee-tn.jpeg" alt="1 kg kisan ghee" title="1 kg kisan ghee" /></li>
                <li><img src="images/DANEDAR%201%20KG-tn.jpeg" alt="DANEDAR 1 KG" title="DANEDAR 1 KG" /></li>
                <li><img src="images/danedar-tn.jpeg" alt="danedar" title="danedar" /></li>
                <li><img src="images/FAMILY%20MISTURE-tn.jpeg" alt="FAMILY MISTURE" title="FAMILY MISTURE" /></li>
                <li><img src="images/KANOLA%20OIL-tn.jpg" alt="KANOLA OIL" title="KANOLA OIL" /></li>
                <li><img src="images/sugar-tn.jpeg" alt="sugar" title="sugar" /></li>
            </ul>
        <div class="amazingslider-engine"><a href="http://amazingslider.com" title="Slider jQuery">Slider jQuery</a></div>
        </div>
    </div>
    <!-- End of body section HTML codes -->
    
</body>
</html>
